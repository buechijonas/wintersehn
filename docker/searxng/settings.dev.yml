  engines:
    keep_only:
      - duckduckgo
      - duckduckgo images
      - duckduckgo videos
      - duckduckgo news
      - startpage
      - startpage images
      - startpage news
      - wikipedia
      - wikicommons.images
      - wikicommons.videos
      - bing
      - bing images
      - bing news
      - bing videos
      - yahoo
      - yahoo news
      - mwmbl
      - youtube
      - dailymotion
      - sepiasearch
      - flickr

engines:
  - name: startpage
    inactive: false
  - name: startpage images
    inactive: false
  - name: startpage news
    inactive: false
  - name: bing
    disabled: false
    inactive: false
  - name: bing images
    disabled: false
    inactive: false
  - name: bing news
    disabled: false
    inactive: false
  - name: bing videos
    disabled: false
    inactive: false
  - name: yahoo
    disabled: false
    inactive: false
  - name: yahoo news
    disabled: false
    inactive: false
  - name: mwmbl
    disabled: false
    inactive: false
  - name: youtube
    disabled: false
    inactive: false
  - name: dailymotion
    disabled: false
    inactive: false
  - name: sepiasearch
    disabled: false
    inactive: false
  - name: flickr
    disabled: false
    inactive: false

general:
  instance_name: wintersehn
  contact_url: https://search.wintersehn.ch
  debug: false
  enable_metrics: false

search:
  safe_search: 0
  autocomplete: ""
  favicon_resolver: ""
  default_lang: de
  formats:
    - json
  suspended_times:
    SearxEngineAccessDenied: 20
    SearxEngineCaptcha: 20
    SearxEngineTooManyRequests: 20
    cf_SearxEngineCaptcha: 60
    cf_SearxEngineAccessDenied: 60
    recaptcha_SearxEngineCaptcha: 60

server:
  secret_key: dev-only-overridden-by-SEARXNG_SECRET
  limiter: false
  public_instance: false
  image_proxy: true
  method: POST

plugins:
  searx.plugins.tracker_url_remover.SXNGPlugin:
    active: true
  searx.plugins.image_proxy_rewrite.SXNGPlugin:
    active: true
  searx.plugins.query_guard.SXNGPlugin:
    active: true
  searx.plugins.self_info.SXNGPlugin:
    active: false
  searx.plugins.hash_plugin.SXNGPlugin:
    active: false

ui:
  query_in_title: false

outgoing:
  request_timeout: 12.0
  max_request_timeout: 15.0
  useragent_suffix: ""
