services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: wintersehn
      POSTGRES_USER: wintersehn
      POSTGRES_PASSWORD: wintersehn

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wintersehn -d wintersehn"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend

    restart: unless-stopped

    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py createcachetable &&
      python manage.py bootstrap_admin &&
      python manage.py runserver 0.0.0.0:8000
      "

    volumes:
      - ./backend:/app

    ports:
      - "8000:8000"

    environment:
      DB_NAME: wintersehn
      DB_USER: wintersehn
      DB_PASSWORD: wintersehn
      DB_HOST: db
      DB_PORT: 5432
      ADMIN_USERNAME: admin
      ADMIN_EMAIL: admin@wintersehn.ch
      ADMIN_PASSWORD: admin
      # govex runs as its own compose stack (../govex). The browser reaches it
      # via its Vite dev server, this container via the host-exposed backend.
      GOVEX_PUBLIC_URL: http://localhost:5174
      GOVEX_ACCOUNT_URL: http://localhost:5174/account
      GOVEX_INTERNAL_URL: http://host.docker.internal:8001
      GOVEX_CLIENT_ID: wintersehn-dev
      GOVEX_CLIENT_SECRET: wintersehn-dev-secret
      GOVEX_REDIRECT_URI: http://localhost:8000/api/auth/oidc/callback/
      FRONTEND_URL: http://localhost:5173

    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend

    restart: unless-stopped

    command: npm run dev -- --host 0.0.0.0

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    ports:
      - "5173:5173"

    environment:
      VITE_API_URL: http://localhost:8000

    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
