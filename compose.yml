services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: wintersehn
      POSTGRES_USER: wintersehn
      POSTGRES_PASSWORD: wintersehn

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wintersehn -d wintersehn"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend

    restart: unless-stopped

    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py createcachetable &&
      python manage.py bootstrap_admin &&
      python manage.py runserver 0.0.0.0:8000
      "

    volumes:
      - ./backend:/app
      - ./lumon-media:/lumon-media

    ports:
      - "8000:8000"

    environment:
      DB_NAME: wintersehn
      DB_USER: wintersehn
      DB_PASSWORD: wintersehn
      DB_HOST: db
      DB_PORT: 5432
      ADMIN_USERNAME: admin
      ADMIN_EMAIL: admin@wintersehn.ch
      ADMIN_PASSWORD: admin
      GOVEX_PUBLIC_URL: http://localhost:5174
      GOVEX_ACCOUNT_URL: http://localhost:5174/account
      GOVEX_INTERNAL_URL: http://host.docker.internal:9000
      GOVEX_CLIENT_ID: wintersehn-dev
      GOVEX_CLIENT_SECRET: wintersehn-dev-secret
      GOVEX_REDIRECT_URI: http://localhost:8000/api/auth/oidc/callback/
      GOVEX_API_TOKEN: monolith-dev-govex-token
      SWISSFY_INTERNAL_URL: http://host.docker.internal:8001
      SWISSFY_API_TOKEN: monolith-dev-token
      SWISSFY_PUBLIC_URL: http://localhost:5175
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      FRONTEND_URL: http://localhost:5173
      MONOLITH_URL: http://localhost:5172
      CONSENT_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\nMIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgpVJv0m39Ji0/wT/7\n37xarFQG3pV4fyrLw5BsQtekk2yhRANCAAQ3GaiyE0qkvPAeC4KfXCz9b3d1DakQ\n+bimnAbswixpvoxKACFN8M2DOjwDDJxSEd2O7hKELM98RG2hZHZ4E7dP\n-----END PRIVATE KEY-----"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend,host.docker.internal
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5172,http://127.0.0.1:5172,http://localhost:5171,http://127.0.0.1:5171,http://localhost:5170,http://127.0.0.1:5170,http://localhost:5169,http://127.0.0.1:5169,http://localhost:5177,http://127.0.0.1:5177

    depends_on:
      db:
        condition: service_healthy

  wintersehn:
    build:
      context: ./frontend/wintersehn

    restart: unless-stopped

    command: npm run dev -- --host 0.0.0.0 --port 5173 --strictPort

    volumes:
      - ./frontend/wintersehn:/app
      - ./frontend/core:/core
      - wintersehn_node_modules:/app/node_modules

    ports:
      - "5173:5173"

    environment:
      VITE_API_URL: http://localhost:8000
      VITE_SEARCH_URL: http://localhost:5171
      VITE_ATLAS_URL: http://localhost:5169

    depends_on:
      - backend

  monolith:
    build:
      context: ./frontend/monolith

    restart: unless-stopped

    command: npm run dev -- --host 0.0.0.0 --port 5172 --strictPort

    volumes:
      - ./frontend/monolith:/app
      - ./frontend/core:/core
      - monolith_node_modules:/app/node_modules

    ports:
      - "5172:5172"

    environment:
      VITE_API_URL: http://localhost:8000
      VITE_WINTERSEHN_URL: http://localhost:5173
      VITE_SEARCH_URL: http://localhost:5171
      VITE_GOVEX_URL: http://localhost:5174

    depends_on:
      - backend

  search:
    build:
      context: ./frontend/search

    restart: unless-stopped

    command: npm run dev -- --host 0.0.0.0 --port 5171 --strictPort

    volumes:
      - ./frontend/search:/app
      - ./frontend/core:/core
      - search_node_modules:/app/node_modules

    ports:
      - "5171:5171"

    environment:
      VITE_API_URL: http://localhost:8000
      VITE_WINTERSEHN_URL: http://localhost:5173
      VITE_ATLAS_URL: http://localhost:5169

    depends_on:
      - backend
      - searxng

  searxng:
    build:
      context: ./docker/searxng

    restart: unless-stopped

    environment:
      SEARXNG_BASE_SETTINGS: /usr/local/searxng/config/settings.dev.yml
      SEARXNG_CUSTOM_PROXY: ${SEARXNG_CUSTOM_PROXY:-}
      SEARXNG_BRAVE_API_KEY: ${SEARXNG_BRAVE_API_KEY:-}

  home:
    build:
      context: ./frontend/home

    restart: unless-stopped

    command: npm run dev -- --host 0.0.0.0 --port 5170 --strictPort

    volumes:
      - ./frontend/home:/app
      - ./frontend/core:/core
      - home_node_modules:/app/node_modules

    ports:
      - "5170:5170"

    environment:
      VITE_API_URL: http://localhost:8000
      VITE_SEARCH_URL: http://localhost:5171
      VITE_MONOLITH_URL: http://localhost:5172
      VITE_WINTERSEHN_URL: http://localhost:5173
      VITE_GOVEX_URL: http://localhost:5174
      VITE_SWISSFY_URL: http://localhost:5175
      VITE_ATLAS_URL: http://localhost:5169

    depends_on:
      - backend

  atlas:
    build:
      context: ./frontend/atlas

    restart: unless-stopped

    command: npm run dev -- --host 0.0.0.0 --port 5169 --strictPort

    volumes:
      - ./frontend/atlas:/app
      - ./frontend/core:/core
      - atlas_node_modules:/app/node_modules

    ports:
      - "5169:5169"

    environment:
      VITE_API_URL: http://localhost:8000
      VITE_WINTERSEHN_URL: http://localhost:5173
      VITE_SEARCH_URL: http://localhost:5171

    depends_on:
      - backend

  lumon:
    build:
      context: ./frontend/lumon

    restart: unless-stopped

    command: npm run dev -- --host 0.0.0.0 --port 5177 --strictPort

    volumes:
      - ./frontend/lumon:/app
      - ./frontend/core:/core
      - ./lumon-media:/app/lumon-media:ro
      - lumon_node_modules:/app/node_modules

    ports:
      - "5177:5177"

    environment:
      VITE_API_URL: http://localhost:8000
      VITE_WINTERSEHN_URL: http://localhost:5173
      VITE_SEARCH_URL: http://localhost:5171
      VITE_ATLAS_URL: http://localhost:5169

    depends_on:
      - backend

volumes:
  postgres_data:
  wintersehn_node_modules:
  monolith_node_modules:
  search_node_modules:
  home_node_modules:
  atlas_node_modules:
  lumon_node_modules:
